<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1220"/><stop offset="55%" stop-color="#12324a"/><stop offset="100%" stop-color="#0b6b78"/>
  </linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="260" rx="28" fill="url(#bg)"/>
<circle cx="1060" cy="55" r="90" fill="#20c4d8" opacity=".08">
 <animate attributeName="r" values="70;105;70" dur="5s" repeatCount="indefinite"/>
</circle>
<circle cx="1120" cy="210" r="110" fill="#7c5cff" opacity=".07">
 <animate attributeName="r" values="90;125;90" dur="6s" repeatCount="indefinite"/>
</circle>
<g fill="none" stroke="#62e6f2" opacity=".35">
 <path d="M0 210 C180 140 300 270 480 190 S800 130 1200 200"/>
 <path d="M0 230 C190 160 320 285 500 205 S830 145 1200 220"/>
</g>
<text x="70" y="105" fill="white" font-family="Arial,sans-serif" font-size="52" font-weight="700">HEMANTH SANJAY</text>
<text x="73" y="148" fill="#8be9ff" font-family="Arial,sans-serif" font-size="23">AI &amp; Data Science  •  AI/ML  •  Software Engineering</text>
<text x="73" y="190" fill="#d8e9f0" font-family="Arial,sans-serif" font-size="17">Building practical AI systems and turning data into useful products.</text>
<circle cx="1030" cy="130" r="7" fill="#62e6f2" filter="url(#glow)">
 <animate attributeName="opacity" values=".25;1;.25" dur="1.8s" repeatCount="indefinite"/>
</circle>
<circle cx="1080" cy="105" r="4" fill="#ffffff"><animate attributeName="cy" values="105;85;105" dur="3s" repeatCount="indefinite"/></circle>
